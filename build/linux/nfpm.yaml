name: smokelab
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
section: utils
priority: optional
maintainer: Kevin Rodrigues <kevin_3467@yahoo.com>
vendor: SmokeLab
homepage: https://github.com/AntiKevin/SmokeLab
license: Proprietary
description: |-
  Aplicacao local-first para ingestao e exploracao de logs estruturados.
  Inclui a interface desktop SmokeLab e a interface de linha de comando.
umask: 0o022

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

contents:
  - src: ./build/bin/SmokeLab
    dst: /usr/lib/smokelab/SmokeLab
    file_info:
      mode: 0755

  - src: ./build/bin/smokelab
    dst: /usr/bin/smokelab
    file_info:
      mode: 0755

  - src: ./build/linux/smokelab.desktop
    dst: /usr/share/applications/smokelab.desktop
    file_info:
      mode: 0644

  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/smokelab.png
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/smokelab/README.md
    file_info:
      mode: 0644
